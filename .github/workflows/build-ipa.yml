name: Build iOS IPA

on:
  workflow_dispatch: {}        # 手动触发
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/build-ipa.yml"]

jobs:
  build:
    runs-on: macos-15          # 与 videoloader 线路一致
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Run unit tests (simulator, 非阻塞)
        working-directory: ios
        continue-on-error: true
        run: |
          SIM=$(xcrun simctl list devices available |
                grep -m1 -oE 'iPhone [0-9]+ ' | tr -d ' ' || true)
          echo "Simulator: $SIM"
          xcodebuild test \
            -project ClipHarbor.xcodeproj -scheme ClipHarbor \
            -destination "platform=iOS Simulator,name=${SIM:-iPhone 16}" \
            CODE_SIGNING_ALLOWED=NO | tail -40

      - name: Archive (unsigned IPA)
        working-directory: ios
        run: |
          xcodebuild archive \
            -project ClipHarbor.xcodeproj -scheme ClipHarbor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ClipHarbor.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R ios/build/ClipHarbor.xcarchive/Products/Applications/ClipHarbor.app build/Payload/
          cd build && zip -qry ClipHarbor-unsigned.ipa Payload
          ls -la ClipHarbor-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipHarbor-unsigned-ipa
          path: build/ClipHarbor-unsigned.ipa
          retention-days: 30
